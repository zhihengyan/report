  <text x="210" y="357" font-size="10" fill="#0E3A5C" text-anchor="middle">T4</text>
  <text x="248" y="357" font-size="11" fill="#6E6E6E" text-anchor="middle">…</text>
  <rect x="272" y="340" width="40" height="26" rx="5" fill="#E4F0FA" stroke="#9CC9E8" stroke-width="0.9"/>
