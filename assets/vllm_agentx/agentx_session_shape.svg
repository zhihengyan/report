  <rect x="310" y="151" width="52" height="77" rx="2" fill="#2E6F9E"/>
  <rect x="310" y="145" width="52" height="6" rx="2" fill="#D99435"/>
  <rect x="384" y="133" width="52" height="95" rx="2" fill="#2E6F9E"/>
  <rect x="384" y="127" width="52" height="6" rx="2" fill="#D99435"/>
  <rect x="458" y="117" width="52" height="111" rx="2" fill="#2E6F9E"/>
  <rect x="458" y="111" width="52" height="6" rx="2" fill="#D99435"/>
  <rect x="532" y="103" width="52" height="125" rx="2" fill="#2E6F9E"/>
  <rect x="532" y="97" width="52" height="6" rx="2" fill="#D99435"/>

  <rect x="88" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="162" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="236" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="310" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="384" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="458" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <rect x="532" y="236" width="52" height="13" rx="2" fill="#4E9E70"/>
  <text x="64" y="247" font-size="9" fill="#6E6E6E" text-anchor="end">输出</text>

  <text x="114" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T1</text>
  <text x="188" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T2</text>
  <text x="262" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T4</text>
  <text x="336" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T8</text>
  <text x="410" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T16</text>
  <text x="484" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T30</text>
  <text x="558" y="266" font-size="9.5" fill="#6E6E6E" text-anchor="middle">T43</text>

  <text x="88" y="282" font-size="9.5" fill="#6E6E6E">中位输入 142K tokens，中位输出 444 tokens，前缀命中率高于 96%</text>

  <!-- ================== PANEL B ================== -->
  <rect x="16" y="302" width="648" height="150" rx="10" fill="#FAFAFA" stroke="#E2E2E2" stroke-width="0.9"/>
  <text x="30" y="322" font-size="11" fill="#333333">会话结构：主干 43 轮，44% 的会话会分叉出子代理</text>

  <rect x="40" y="340" width="40" height="26" rx="5" fill="#E4F0FA" stroke="#9CC9E8" stroke-width="0.9"/>
  <text x="60" y="357" font-size="10" fill="#17527F" text-anchor="middle">T1</text>
  <rect x="90" y="340" width="40" height="26" rx="5" fill="#E4F0FA" stroke="#9CC9E8" stroke-width="0.9"/>
