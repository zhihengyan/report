  <rect x="322" y="340" width="40" height="26" rx="5" fill="#E4F0FA" stroke="#9CC9E8" stroke-width="0.9"/>
  <text x="342" y="357" font-size="10" fill="#17527F" text-anchor="middle">T6</text>
  <text x="380" y="357" font-size="11" fill="#6E6E6E" text-anchor="middle">…</text>
  <rect x="404" y="340" width="46" height="26" rx="5" fill="#E4F0FA" stroke="#9CC9E8" stroke-width="0.9"/>
  <text x="427" y="357" font-size="10" fill="#17527F" text-anchor="middle">T43</text>

  <line x1="80" y1="353" x2="84" y2="353" stroke="#7FB4DA" stroke-width="1.2"/>
  <path d="M83.5 349.6 L89.9 353 L83.5 356.4 Z" fill="#7FB4DA"/>
  <line x1="130" y1="353" x2="134" y2="353" stroke="#7FB4DA" stroke-width="1.2"/>
