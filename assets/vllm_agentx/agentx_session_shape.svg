  <line x1="388" y1="353" x2="398" y2="353" stroke="#7FB4DA" stroke-width="1.2"/>
  <path d="M397.5 349.6 L403.9 353 L397.5 356.4 Z" fill="#7FB4DA"/>

  <rect x="190" y="392" width="234" height="26" rx="5" fill="#FBF0D5" stroke="#D9B44A" stroke-width="0.9"/>
  <text x="307" y="409" font-size="10" fill="#6B4A0A" text-anchor="middle">子代理 rollout（这些会话中位 4 个）</text>
  <path d="M210 368 V385" fill="none" stroke="#C08A1E" stroke-width="1.1" stroke-dasharray="4 3"/>
  <path d="M206.5 385.4 L213.5 385.4 L210 391.2 Z" fill="#C08A1E"/>
  <path d="M424 405 H596 V353 H457" fill="none" stroke="#C08A1E" stroke-width="1.1" stroke-dasharray="4 3"/>
  <path d="M457 349.6 L457 356.4 L450.6 353 Z" fill="#C08A1E"/>
  <text x="510" y="425" font-size="9.5" fill="#8A6E33" text-anchor="middle">结果并回主干</text>
  <text x="30" y="440" font-size="9.5" fill="#6E6E6E">子代理继承父上下文或另起；单轮之间常有数秒级间隔，前缀仍可能驻留在原卡上</text>

  <text x="16" y="476" font-size="9" fill="#7A7A7A">柱高按文中中位数缩放，为示意图；原文对应图为可交互页面。</text>
</svg>
