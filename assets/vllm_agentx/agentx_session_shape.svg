<svg width="680" height="492" viewBox="0 0 680 492" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>智能体会话的负载形状：上下文只增不减，输出始终很短</title>
  <desc>上半部分为逐轮请求构成示意图。七根柱按轮次 T1、T2、T4、T8、T16、T30、T43 排列，柱高代表该轮请求的输入长度，由下方深蓝的复用前缀段与顶端一小截橙色的新增 prefill 段堆叠而成；柱高随轮次单调增长到约 142K tokens，而橙色新增段始终只有很小一截。柱下方另有一排近乎等高的绿色短柱，代表每轮输出，始终维持在几百 token 量级。下半部分为会话结构示意：主干从 T1 连到 T43，在 T4 处分叉出一条虚线，进入标注为子代理 rollout 的节点，再把结果合流回主干末尾；统计信息为 43 轮中位轮次、44% 的会话至少含一个子代理、这些会话中子代理 rollout 中位数为 4。</desc>
  <style>
    text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  </style>

  <rect x="0" y="0" width="680" height="492" fill="#FFFFFF"/>
  <text x="16" y="26" font-size="14" font-weight="600" fill="#1A1A1A">智能体会话的负载形状：输入一直涨，输出一直短</text>

  <!-- ================== PANEL A ================== -->
  <rect x="16" y="40" width="648" height="250" rx="10" fill="#FAFAFA" stroke="#E2E2E2" stroke-width="0.9"/>
  <text x="30" y="60" font-size="11" fill="#333333">每轮请求的构成：绝大部分是引擎已经见过的前缀</text>
  <rect x="368" y="51" width="10" height="10" rx="2" fill="#2E6F9E"/>
  <text x="382" y="60" font-size="9.5" fill="#2A5F82">复用前缀</text>
  <rect x="446" y="51" width="10" height="10" rx="2" fill="#D99435"/>
  <text x="460" y="60" font-size="9.5" fill="#8A5E12">新增 prefill</text>
  <rect x="542" y="51" width="10" height="10" rx="2" fill="#4E9E70"/>
  <text x="556" y="60" font-size="9.5" fill="#2E7A54">输出</text>

  <line x1="72" y1="88" x2="648" y2="88" stroke="#ECECEC" stroke-width="0.8"/>
  <line x1="72" y1="123" x2="648" y2="123" stroke="#ECECEC" stroke-width="0.8"/>
  <line x1="72" y1="158" x2="648" y2="158" stroke="#ECECEC" stroke-width="0.8"/>
  <line x1="72" y1="193" x2="648" y2="193" stroke="#ECECEC" stroke-width="0.8"/>
  <line x1="72" y1="228" x2="648" y2="228" stroke="#C8C8C8" stroke-width="1"/>
  <text x="64" y="91" font-size="9" fill="#6E6E6E" text-anchor="end">160K</text>
  <text x="64" y="126" font-size="9" fill="#6E6E6E" text-anchor="end">120K</text>
  <text x="64" y="161" font-size="9" fill="#6E6E6E" text-anchor="end">80K</text>
  <text x="64" y="196" font-size="9" fill="#6E6E6E" text-anchor="end">40K</text>
  <text x="64" y="231" font-size="9" fill="#6E6E6E" text-anchor="end">0</text>

  <rect x="88" y="212" width="52" height="16" rx="2" fill="#2E6F9E"/>
  <rect x="88" y="206" width="52" height="6" rx="2" fill="#D99435"/>
  <rect x="162" y="191" width="52" height="37" rx="2" fill="#2E6F9E"/>
  <rect x="162" y="185" width="52" height="6" rx="2" fill="#D99435"/>
