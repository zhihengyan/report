  <path d="M265.5 349.6 L271.9 353 L265.5 356.4 Z" fill="#7FB4DA"/>
  <line x1="312" y1="353" x2="316" y2="353" stroke="#7FB4DA" stroke-width="1.2"/>
  <path d="M315.5 349.6 L321.9 353 L315.5 356.4 Z" fill="#7FB4DA"/>
